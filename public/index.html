<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusChat — Mensajería en tiempo real</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
</head>
<body>

  <!-- ============================================================= -->
  <!-- PANTALLA DE AUTENTICACIÓN (Login / Registro)                  -->
  <!-- ============================================================= -->
  <section id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-icon">💬</span>
        <h1>NexusChat</h1>
        <p class="tagline">Mensajería en tiempo real para amigos y familia</p>
      </div>

      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active" type="button">Iniciar sesión</button>
        <button id="tab-register" class="auth-tab" type="button">Registrarse</button>
      </div>

      <!-- LOGIN -->
      <form id="login-form" class="auth-form" autocomplete="on">
        <label>
          <span>Usuario</span>
          <input type="text" name="username" required placeholder="tu_usuario" autocomplete="username" />
        </label>
        <label>
          <span>Contraseña</span>
          <input type="password" name="password" required placeholder="••••••" autocomplete="current-password" />
        </label>
        <button type="submit" class="btn-primary">Entrar</button>
        <p class="auth-error" id="login-error"></p>
      </form>

      <!-- REGISTRO -->
      <form id="register-form" class="auth-form hidden" autocomplete="on">
        <label>
          <span>Nombre para mostrar</span>
          <input type="text" name="displayName" required placeholder="Juan Pérez" />
        </label>
        <label>
          <span>Usuario</span>
          <input type="text" name="username" required placeholder="juanp" minlength="3" />
        </label>
        <label>
          <span>Email</span>
          <input type="email" name="email" required placeholder="juan@ejemplo.com" />
        </label>
        <label>
          <span>Contraseña</span>
          <input type="password" name="password" required placeholder="mínimo 6 caracteres" minlength="6" autocomplete="new-password" />
        </label>
        <button type="submit" class="btn-primary">Crear cuenta</button>
        <p class="auth-error" id="register-error"></p>
      </form>
    </div>
  </section>

  <!-- ============================================================= -->
  <!-- PANTALLA PRINCIPAL (SPA)                                      -->
  <!-- ============================================================= -->
  <main id="app-screen" class="app-screen hidden">

    <!-- ============== PANEL IZQUIERDO ============== -->
    <aside class="sidebar" id="sidebar">
      <header class="sidebar-header">
        <div class="me">
          <div class="avatar" id="me-avatar">?</div>
          <div class="me-info">
            <strong id="me-name">—</strong>
            <small id="me-status">—</small>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="btn-notifications" title="Activar notificaciones">🔔</button>
          <button class="icon-btn" id="btn-new-chat" title="Nuevo chat">＋</button>
          <button class="icon-btn" id="btn-profile" title="Mi perfil">⚙️</button>
          <button class="icon-btn" id="btn-logout" title="Cerrar sesión">⎋</button>
        </div>
      </header>

      <div class="search-box">
        <input type="text" id="search-input" placeholder="Buscar chats o usuarios..." />
      </div>

      <div class="chat-list" id="chat-list"></div>
    </aside>

    <!-- ============== PANEL DERECHO ============== -->
    <section class="chat-panel" id="chat-panel">

      <div class="empty-state" id="empty-state">
        <div class="empty-icon">💬</div>
        <h2>Selecciona un chat</h2>
        <p>Elige una conversación de la izquierda o crea una nueva para empezar.</p>
      </div>

      <div class="chat-view hidden" id="chat-view">
        <header class="chat-header">
          <button class="icon-btn back-btn" id="btn-back" title="Volver">←</button>
          <div class="avatar" id="chat-avatar">?</div>
          <div class="chat-header-info">
            <strong id="chat-title">—</strong>
            <small id="chat-subtitle">—</small>
          </div>
          <div class="chat-header-actions">
            <button class="icon-btn" id="btn-chat-info" title="Info del chat">ℹ️</button>
          </div>
        </header>

        <div class="messages" id="messages"></div>

        <div class="typing-indicator hidden" id="typing-indicator">
          <span id="typing-text">Alguien está escribiendo</span>
          <span class="dots"><span></span><span></span><span></span></span>
        </div>

        <form class="message-form" id="message-form">
          <button type="button" class="icon-btn" id="btn-emoji" title="Emoji">😊</button>
          <input
            type="text"
            id="message-input"
            placeholder="Escribe un mensaje..."
            autocomplete="off"
            maxlength="2000"
          />
          <button type="submit" class="icon-btn send-btn" id="btn-send" title="Enviar">➤</button>
        </form>
      </div>
    </section>
  </main>

  <!-- ============================================================= -->
  <!-- MODAL: Nuevo chat                                             -->
  <!-- ============================================================= -->
  <div class="modal hidden" id="modal-new-chat">
    <div class="modal-content">
      <header class="modal-header">
        <h3>Nuevo chat</h3>
        <button class="icon-btn" data-close-modal="modal-new-chat">✕</button>
      </header>

      <div class="modal-tabs">
        <button class="modal-tab active" id="newtab-1a1" type="button">1 a 1</button>
        <button class="modal-tab" id="newtab-group" type="button">Grupal</button>
      </div>

      <div class="search-box">
        <input type="text" id="user-search" placeholder="Buscar usuario por nombre o @usuario..." />
      </div>

      <div class="user-results" id="user-results">
        <p class="hint">Escribe para buscar usuarios registrados.</p>
      </div>

      <div class="group-name-box hidden" id="group-name-box">
        <input type="text" id="group-name" placeholder="Nombre del grupo" maxlength="80" />
      </div>

      <div class="selected-users" id="selected-users"></div>

      <footer class="modal-footer">
        <button class="btn-secondary" data-close-modal="modal-new-chat">Cancelar</button>
        <button class="btn-primary" id="btn-create-chat" disabled>Crear chat</button>
      </footer>
    </div>
  </div>

  <!-- ============================================================= -->
  <!-- MODAL: Mi perfil                                              -->
  <!-- ============================================================= -->
  <div class="modal hidden" id="modal-profile">
    <div class="modal-content">
      <header class="modal-header">
        <h3>Mi perfil</h3>
        <button class="icon-btn" data-close-modal="modal-profile">✕</button>
      </header>

      <form id="profile-form" class="modal-body">
        <label>
          <span>Nombre para mostrar</span>
          <input type="text" name="displayName" id="profile-displayName" maxlength="50" />
        </label>
        <label>
          <span>Mensaje de estado</span>
          <input type="text" name="status" id="profile-status" maxlength="120" />
        </label>
        <label>
          <span>URL de avatar (opcional)</span>
          <input type="url" name="avatar" id="profile-avatar" placeholder="https://..." />
        </label>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" data-close-modal="modal-profile">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============================================================= -->
  <!-- TOAST (notificaciones)                                        -->
  <!-- ============================================================= -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
